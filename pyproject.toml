[project]
name = "bispy-polar"
# Single source of truth for the version. Bump with `uv version --bump ...`
# or set it with `uv version X.Y.Z`; the git tag must match (`vX.Y.Z`).
version = "0.10.1.dev0"
description = "An open-source Python framework for processing bivariate signals."
readme = "README.md"
requires-python = ">=3.10"
# SPDX expression; must match the LICENCE file.
license = "MIT"
license-files = ["LICENCE"]
authors = [{ name = "Julien Flamant", email = "julien.flamant@cnrs.fr" }]
keywords = [
    "signal processing",
    "bivariate signals",
    "polarization",
    "quaternion",
    "time-frequency analysis",
    "spectral analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# Lower bounds are exercised by the "lowest-direct" CI job.
# numpy-quaternion >= 2024.0.2 is the first release built for numpy 2.
dependencies = [
    "numpy>=1.25",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "numpy-quaternion>=2024.0.2",
]

[project.urls]
Homepage = "https://github.com/jflamant/bispy"
Documentation = "https://jflamant.github.io/bispy/"
Source = "https://github.com/jflamant/bispy"
Issues = "https://github.com/jflamant/bispy/issues"

# Development-only dependencies (not published). `uv sync` installs the `dev` group.
[dependency-groups]
test = ["pytest>=8", "pytest-cov>=5", "pytest-regressions>=2.5"]
# myst-nb renders and executes the tutorial notebooks; ipython provides their
# "ipython3" syntax highlighter.
docs = ["sphinx>=7", "sphinx-rtd-theme>=2", "numpydoc>=1.6", "myst-parser>=2", "myst-nb>=1", "ipython>=8"]
lint = ["ruff>=0.8"]
dev = [
    { include-group = "test" },
    { include-group = "docs" },
    { include-group = "lint" },
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package lives in ./bispy, and the import name differs from
# the distribution name.
module-name = "bispy"
module-root = ""
# Ship the test suite in the source distribution.
source-include = ["tests/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
# Known bugs are marked xfail: once a bug is fixed, its test passes, and strict
# mode turns that into a failure until the marker is removed.
xfail_strict = true

[tool.ruff.lint]
select = [
    "E9",   # syntax errors
    "F",    # pyflakes: undefined names, unused imports and variables
    "B",    # bugbear: likely bugs (mutable defaults, ...)
    "UP",   # pyupgrade: modern syntax for the supported Python versions
    "NPY",  # numpy-specific rules (legacy random API, deprecated aliases)
    "I",    # import sorting
]

[tool.ruff.lint.per-file-ignores]
# The tests use the legacy global RNG on purpose, to check np.random.seed compatibility.
"tests/**" = ["NPY002"]
# The tutorials show the usual imports and the classic numpy random API on purpose;
# they are still checked for real errors (syntax, undefined names, ...).
"docs/tutorials/*.ipynb" = ["F401", "I001", "NPY002", "B007"]
